org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=47.4.26
# The lowest Forge (and NeoForge 1.20.1) version the mod accepts.
forge_version_range=[47,)
loader_version_range=[47,)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
# Fabric: the versions to build with; the *_min_version ones are what fabric.mod.json asks of players.
fabric_loader_version=0.19.2
fabric_loader_min_version=0.15.0
fabric_api_version=0.92.12+1.20.1
fabric_api_min_version=0.92.0
diegesis_version=1.0.0-beta.19.1
diegesis_version_range=[1.0.0-beta.19.1,)
# Recipe viewers, compile only: what is under the cursor at a station, and JEI's transfer into a crafting table station.
jei_version=15.2.0.27
emi_version=1.1.24+1.20.1

## Mod
mod_id=handson_vanilla
mod_name=Hands-On Vanilla
mod_version=1.2.5
mod_group_id=com.pockyl.handson_vanilla
mod_license=MIT
mod_authors=Pocky
mod_description=Craft and smelt with your own hands, right on the crafting table and the furnace. Client-side: works on any server.
mod_url=https://github.com/Pocky-l/handson-vanilla

## CurseForge
# Numeric project ID from the CurseForge project page ("About Project" sidebar).
curseforge_project_id=1809623
curseforge_client=true
curseforge_server=false
# Comma-separated CurseForge project slugs; curseforge_requires_<loader> replaces the list for that loader.
curseforge_requires=diegesis
curseforge_requires_fabric=diegesis,fabric-api
curseforge_optional=jei,emi
