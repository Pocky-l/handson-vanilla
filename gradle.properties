org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=26.2
minecraft_version_range=[26.2]
neo_version=26.2.0.88
# The plain Minecraft the common project compiles against (https://projects.neoforged.net/neoforged/neoform).
# Minecraft 26.x ships unobfuscated: no Parchment mappings.
neo_form_version=26.2-2
loader_version_range=[1,)
# Fabric: the versions to build with; the *_min_version ones are what fabric.mod.json asks of players (Diegesis' minimum).
fabric_loader_version=0.20.1
fabric_loader_min_version=0.19.5
fabric_api_version=0.161.0+26.2
fabric_api_min_version=0.161.0
diegesis_version=1.0.0-beta.17.2
diegesis_version_range=[1.0.0-beta.17.2,)
# Recipe viewer, compile only: what is under the cursor at a station, and JEI's transfer into a crafting table station. The
# first JEI release for 26.2 on purpose, so that a call older JEI builds lack fails the build, not the game. EMI has no
# build for Minecraft 26.x: its support is left out of this line's build (common/build.gradle).
jei_version=30.28.0.193

## Mod
mod_id=handson_vanilla
mod_name=Hands-On Vanilla
mod_version=1.2.3
mod_group_id=com.pockyl.handson_vanilla
mod_license=MIT
mod_authors=Pocky
mod_description=Craft and smelt with your own hands, right on the crafting table and the furnace. Client-side: works on any server.
mod_url=https://github.com/Pocky-l/handson-vanilla

## CurseForge
# Numeric project ID from the CurseForge project page ("About Project" sidebar).
curseforge_project_id=1809623
curseforge_client=true
curseforge_server=false
# Comma-separated CurseForge project slugs; curseforge_requires_<loader> replaces the list for that loader.
curseforge_requires=diegesis
curseforge_requires_fabric=diegesis,fabric-api
curseforge_optional=jei
