org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.253
neo_form_version=1.21.1-20240808.144430
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Fabric: the versions to build with; the *_min_version ones are what fabric.mod.json asks of players (Diegesis' minimum).
fabric_loader_version=0.19.5
fabric_loader_min_version=0.16.1
fabric_api_version=0.116.17+1.21.1
fabric_api_min_version=0.102.0
diegesis_version=1.0.0-beta.14
diegesis_version_range=[1.0.0-beta.14,)
# Recipe viewers, compile only: what is under the cursor at a station, and JEI's transfer into a crafting table station.
jei_version=19.8.4.110
emi_version=1.1.24+1.21.1

## Mod
mod_id=handson_vanilla
mod_name=Hands-On Vanilla
mod_version=1.2.2
mod_group_id=com.pockyl.handson_vanilla
mod_license=MIT
mod_authors=Pocky
mod_description=Craft and smelt with your own hands, right on the crafting table and the furnace. Client-side: works on any server.
mod_url=https://github.com/Pocky-l/handson-vanilla

## CurseForge
# Numeric project ID from the CurseForge project page ("About Project" sidebar).
curseforge_project_id=1809623
curseforge_client=true
curseforge_server=false
# Comma-separated CurseForge project slugs; curseforge_requires_<loader> replaces the list for that loader.
curseforge_requires=diegesis
curseforge_requires_fabric=diegesis,fabric-api
curseforge_optional=jei,emi
