pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'handson_vanilla'

// common: the stations, scenes and assets, compiled against plain Minecraft and the Diegesis API; neoforge / fabric: the
// loader glue. Each loader project compiles the common sources into its own jar.
include 'common', 'neoforge', 'fabric'

// The Diegesis library comes from its 1.21.1 working copy (mods-1.21.1/diegesis) while both are developed together.
includeBuild('../diegesis')
