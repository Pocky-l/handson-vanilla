// Shared by common, neoforge and fabric: Java version, repositories, jar naming and contents.
plugins {
    id 'java-library'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    // Recipe viewer, compile only: JEI (EMI has no build for Minecraft 26.x).
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared (JEI)'
                url = 'https://maven.blamejared.com/'
            }
        }
        filter { includeGroup('mezz.jei') }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // javac stops at 100 errors otherwise: a port needs the whole list at once.
    options.compilerArgs.addAll(['-Xmaxerrs', '50000'])
}

tasks.named('jar', Jar) {
    def licenseName = "LICENSE_${mod_id}"
    from(rootProject.file('LICENSE')) {
        rename { licenseName }
    }
    manifest.attributes(
            'Implementation-Title': mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor': mod_authors,
    )
}
