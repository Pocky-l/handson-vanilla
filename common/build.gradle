// The stations, scenes and assets, compiled against plain Minecraft and the Diegesis API. Nothing here may use a loader
// API: that goes through the loader projects.
plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
}

// Minecraft 26.1.2: EMI has no build, so what compiles against it is left out of the build (the sources stay). The loader
// projects leave out the same files, and the EMI mixins are left out of handson_vanilla.mixins.json. FastBenchResult serves
// FastWorkbench, which has no 26.1.2 build.
ext.compatSources = [
        'com/pockyl/handson_vanilla/compat/emi/**',
        'com/pockyl/handson_vanilla/client/EmiSidebar.java',
        'com/pockyl/handson_vanilla/mixin/EmiApiMixin.java',
        'com/pockyl/handson_vanilla/mixin/StationInputMixin.java',
        'com/pockyl/handson_vanilla/client/FastBenchResult.java',
]
sourceSets.main.java.exclude(compatSources)

dependencies {
    compileOnly "com.pockyl.diegesis:common:${diegesis_version}"
    compileOnly 'org.spongepowered:mixin:0.8.5'
    // Recipe viewer. JEI: an old API on purpose, so that a call older JEI builds lack fails the build, not the game.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
